services:
  todo-app:
    build: .
    ports:
      - "8000:8000"
    container_name: fastapi_tracking_time
    env_file:
      - .env
  postgres:
    image: postgres:17.4
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw
      TZ: America/Chicago
      PGTZ: America/Chicago
        - DATABASE_URL=postgresql://fastapi_user:password@postgres:5432/fastapi_db
    ports:
        - "5432:5432"
    secrets:
      - pg_user
      - pg_pw
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
    command: >
      postgres
               -c logging_collector=on
               -c log_directory=/var/log/postgresql
               -c log_filename=postgresql.log
               -c log_statement=all
               -c log_connections=on
               -c log_disconnections=on
               -c log_destination=stderr,csvlog
               -c log_rotation_age=1d
               -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    restart: unless-stopped

secrets:
  pg_user:
    file: ./secrets/pg_user.txt
  pg_pw:
    file: ./secrets/pg_pw.txt

