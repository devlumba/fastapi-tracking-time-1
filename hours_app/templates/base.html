<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sesh Tracking App</title>
    <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: skyblue;">
<div style="display: flex;">
<div class="target" style="background-color: skyblue;">

    <button hx-get="/users-all" hx-target=".target" hx-swap="innerHTML">
        view all users
    </button>

    {% if current_user %}
    <button hx-get="/seshs-all-htmx" hx-target=".target" hx-swap="innerHTML">
        view YOUR posts
    </button>
    {% else %}

    <button hx-get="/register-form" hx-target=".target" hx-swap="innerHTML">
    i pull up(register)
    </button>

    <button hx-get="/login-form" hx-target=".target" hx-swap="innerHTML">
    login
    </button>

    {% endif %}

    <button hx-get="" hx-target=".target" hx-swap="innerHTML">
    delete all
    </button>

    {% if token %}
    <button hx-get="/seshs" hx-target=".target" hx-swap="innerHTML" hx-headers="{'Authorization': 'Bearer {{ token }}'}">
    2
    </button>
    {% endif %}

    {% if current_user %}
    <button hx-get="/get-curr-user" hx-target=".target" hx-swap="innerHTML">
    user
    </button>

    <button hx-get="/sesh-create-form" hx-target=".target" hx-swap="innerHTML">
    create a sesh
    </button>

    <a class="h4 link-underline-dark" hx-get="/specific-user/{{ current_user.id }}" hx-target=".target" hx-swap="innerHTML">{{ current_user.username }}</a>
    <button hx-get="/logout" hx-target=".target" hx-swap="innerHTML" hx-confirm="Are you sure?">
    log out
    </button>
    <input type="search" name="q"
    hx-post="/search_results"
    hx-trigger="keyup changed delay:500ms"
    hx-target="#search-results"
       hx-target=".target"
       hx-swap="innerHTML"
    placeholder="Search...">
    <div id="search-results"></div>
    {% endif %}

    </div>

</div>

{% if message %}
<h1>{{ message }}</h1>
{% endif %}

<div style="margin: 20px; width: 50vw;" class="content-section">
{% block body %}
{% endblock body %}
</div>



<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
