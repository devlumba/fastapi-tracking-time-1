<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sesh Tracking App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
</head>
<body>
<div style="display: flex ; flex-wrap: wrap; gap: 10px;">
<div class="target">

    <button class="btn btn-secondary btn-lg" hx-get="/users/" hx-target=".target" hx-swap="innerHTML">
        view all users
    </button>

    {% if current_user %}
    <button class="btn btn-secondary btn-lg" hx-get="/seshs" hx-target=".target" hx-swap="innerHTML">
        view YOUR posts
    </button>
    {% else %}

    <button class="btn btn-secondary btn-lg" hx-get="/register-form" hx-target=".target" hx-swap="innerHTML">
    i pull up(register)
    </button>

    <button class="btn btn-secondary btn-lg" hx-get="/login-form" hx-target=".target" hx-swap="innerHTML">
    login
    </button>

    {% endif %}

    <button class="btn btn-secondary btn-lg" hx-get="" hx-target=".target" hx-swap="innerHTML">
        X
    </button>

    {% if token %}
    <button class="btn btn-secondary btn-lg" hx-get="/seshs" hx-target=".target" hx-swap="innerHTML" hx-headers="{'Authorization': 'Bearer {{ token }}'}">
    2
    </button>
    {% endif %}

    {% if current_user %}

    <button class="btn btn-secondary btn-lg" hx-get="/sesh-create-form" hx-target=".target" hx-swap="innerHTML">
    create a sesh
    </button>

    <button class="btn btn-primary btn-lg" hx-get="/me" hx-target=".target" hx-swap="innerHTML">
        {{ current_user.username }}
    </button>
    <button class="btn btn-secondary btn-lg" hx-get="/logout" hx-target=".target" hx-swap="innerHTML" hx-confirm="Are you sure?">
    log out
    </button>
    <input type="search" name="q"
    hx-post="/search_results"
    hx-trigger="keyup changed delay:500ms"
    hx-target="#search-results"
       hx-target=".target"
       hx-swap="innerHTML"
    placeholder="Search...">
    <div id="search-results"></div>
    {% endif %}

    </div>

</div>

{% if message %}
<h1>{{ message }}</h1>
{% endif %}

<div style="margin: 20px; width: 50vw;" class="content-section">
{% block body %}
{% endblock body %}
</div>

<script>
    document.body.addEventListener('htmx:configRequest', function(evt) {
        const token = document.cookie.match(/access_token=([^;]+)/)?.[1];
        if (token) {
            evt.detail.headers['Authorization'] = 'Bearer ' + token;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
