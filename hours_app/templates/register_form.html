{% extends "base.html" %}
{% block body %}

<form action="" method="post">
    <input placeholder="username" name="username" type="text">
    <input placeholder="password" name="password" type="password">
    <input placeholder="confirm_password" name="confirm_password" type="password">
    <input placeholder="full_name" name="full_name" type="text">
    <button hx-post="/register" hx-swap="innerHTML" hx-target="closest .target" type="submit">click</button>
</form>

{% endblock body %}
