{% extends "base.html" %}
{% block body %}
    {% for sesh in seshs %}
    <div style="border-style: dotted; margin: 2px;">
    <p>{{ sesh.type.name }}</p>
    <h1>{{ sesh.length }} minutes</h1>
    <h2>{{ sesh.specifics }} <small>{{ sesh.day }}</small></h2>
    </div>
    {% endfor %}

{% endblock body %}
