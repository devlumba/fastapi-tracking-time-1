{% extends "base.html" %}
{% block body %}
    <div style="border-style: solid; margin: 7px; padding: 5px;">
        <div class="content-section">
                <div class="content-section">
                    <a href="#" class="link-underline-dark" hx-get="/specific-user/{{ user.id }}" hx-target=".target" hx-swap="innerHTML">
                        <h1 class="task-title">{{ user.username }}</h1>
                    </a>
                    <hr>
                    <pre class="h2">{{ user.full_name }}</pre>
                    <h5>{{ user.id }}</h5>
                </div>
        <a class="btn btn-primary"
            href="#" hx-get="/user-update-form/{{user.id}}" hx-target="closest div" hx-swap="innerHTML">Update</a>
        <a class="btn btn-danger"
           href="#" hx-delete="/user-delete/{{user.id}}" hx-confirm="Are you sure?" hx-target="closest div" hx-swap="delete">Delete</a>
        </div>
    </div>
{% endblock body %}
